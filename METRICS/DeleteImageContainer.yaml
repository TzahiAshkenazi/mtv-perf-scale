---
- name: Stop container and delete image of collect metrics
  hosts: localhost
  gather_facts: false
  collections:
    - containers.podman

  tasks:
    - name: Stop govc container
      podman_container:
        name: govc_metrics
        state: absent

    - name: Pause for 3 seconds
      ansible.builtin.pause:
        seconds: 3

    - name: Remove mygovc_metrics image
      podman_image:
        name: localhost/mygovc_metrics
        tag: latest
        state: absent

